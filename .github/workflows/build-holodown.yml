name: Build HoloDown APK

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Choose Build Type (debug / release)'
        required: true
        default: 'debug'
        type: choice
        options:
          - debug
          - release
  push:
    paths:
      - 'HoloDown/**'
      - '.github/workflows/build-holodown.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: 'true'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Build HoloDown APK
        working-directory: HoloDown
        run: |
          chmod +x gradlew || true
          if [ "${{ github.event.inputs.build_type }}" = "release" ]; then
            gradle assembleRelease --stacktrace || ./gradlew assembleRelease --stacktrace
          else
            gradle assembleDebug --stacktrace || ./gradlew assembleDebug --stacktrace
          fi

      - name: Upload HoloDown APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: HoloDown-${{ github.event.inputs.build_type || 'debug' }}
          path: HoloDown/app/build/outputs/apk/**/*.apk
          retention-days: 7
